<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Open chat</title>
  <link rel="stylesheet" href="/static/style.css">
  <meta name="description" content="Login-Seite für Open chat">
  <meta name="author" content="Markus Stuefer">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <!-- SEO meta tags -->

</head>

<body>
  <main class="auth-shell">
    <section class="auth-panel" aria-label="Anmeldung">
      <header class="auth-header">
        <h1>Open chat</h1>
        <p>{{if .AllowRegistration}}Melde dich an oder erstelle einen Account.{{else}}Melde dich an. Die Registrierung ist geschlossen.{{end}}</p>
      </header>

      {{if .Error}}
      <p class="auth-error" role="alert">{{.Error}}</p>
      {{end}}

      <form class="auth-form" method="post" action="/login">
        <label for="username">Benutzername</label>
        <input id="username" name="username" type="text" maxlength="32" pattern="[A-Za-z0-9_.\-]{3,32}"
          autocomplete="username" value="{{.Username}}" required>

        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" minlength="8"
          autocomplete="current-password" required>

        <!-- The clicked button sends the mode. Enter uses the first one, which is the login. -->
        <div class="auth-actions">
          <button type="submit" name="mode" value="login">Einloggen</button>
          {{if .AllowRegistration}}
          <button type="submit" class="button-secondary" name="mode" value="register">Registrieren</button>
          {{end}}
        </div>
      </form>
    </section>

  </main>

  <footer class="auth-footer">
    <p>Open chat &copy; 2026</p>
    <p>Made with ❤️ by <a href="https://markusstuefer.com">Markus Stuefer</a></p>
  </footer>
</body>

</html>
